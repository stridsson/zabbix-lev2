            key: net.if.out.discards[{#SNMPINDEX}]
      master_item:
        key: net.if.walk
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#IFDESCR}'
        - 1.3.6.1.2.1.2.2.1.2
        - '1'
