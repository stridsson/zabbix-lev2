      trigger_prototypes:
      - uuid: 0afa09fffc5d4c36b93c0d4af2a78883
        expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}])=2 and (last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}],#1)<>last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}],#2))'
        name: 'MikroTik CHR: Interface {#IFNAME}({#IFALIAS}): Link down'
        priority: AVERAGE
        opdata: 'Current state: {ITEM.LASTVALUE1}'
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        manual_close: 'YES'
        description: 'Интерфейс перешёл в состояние down. Срабатывает только при смене статуса. Отключить для интерфейса: {$IFCONTROL:"<имя>"}=0.'
        tags:
        - tag: scope
          value: availability
      - uuid: 6a79c98bd15b4937a2575cafd0617963
        expression: min(/MikroTik CHR by SNMP custom/net.if.in.errors[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"} or min(/MikroTik CHR by SNMP custom/net.if.out.errors[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
        name: 'MikroTik CHR: Interface {#IFNAME}({#IFALIAS}): High error rate'
        priority: WARNING
        opdata: 'errors in: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE2}'
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/MikroTik CHR by SNMP custom/net.if.in.errors[{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8 and max(/MikroTik CHR by SNMP custom/net.if.out.errors[{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
        manual_close: 'YES'
        description: Ошибки на интерфейсе выше {$IF.ERRORS.WARN:"{#IFNAME}"} пакетов/с в течение 5 минут.
        dependencies:
        - name: 'MikroTik CHR: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}])=2 and (last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}],#1)<>last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}],#2))'
          recovery_expression: last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
      - uuid: 06d015491f4348e3aafc0747ddce0c0e
        expression: (avg(/MikroTik CHR by SNMP custom/net.if.in[{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/MikroTik CHR by SNMP custom/net.if.speed[{#SNMPINDEX}]) or avg(/MikroTik CHR by SNMP custom/net.if.out[{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/MikroTik CHR by SNMP custom/net.if.speed[{#SNMPINDEX}])) and last(/MikroTik CHR by SNMP custom/net.if.speed[{#SNMPINDEX}])>0
        name: 'MikroTik CHR: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
        priority: WARNING
        opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: avg(/MikroTik CHR by SNMP custom/net.if.in[{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/MikroTik CHR by SNMP custom/net.if.speed[{#SNMPINDEX}]) and avg(/MikroTik CHR by SNMP custom/net.if.out[{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/MikroTik CHR by SNMP custom/net.if.speed[{#SNMPINDEX}])
        manual_close: 'YES'
        description: Средняя загрузка за 15 минут выше {$IF.UTIL.MAX:"{#IFNAME}"}% от скорости интерфейса.
        dependencies:
        - name: 'MikroTik CHR: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}])=2 and (last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}],#1)<>last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}],#2))'
          recovery_expression: last(/MikroTik CHR by SNMP custom/net.if.status[{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: performance
      graph_prototypes:
      - uuid: db072aad973d4a1888c5d98fe021da45
        name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
        graph_items:
        - drawtype: GRADIENT_LINE
